name: Migrate new repository contents

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-new.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace target contents with new repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jukensoudan-route/new.git /tmp/source
          cp CNAME /tmp/CNAME.keep
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/source/ ./
          cp /tmp/CNAME.keep CNAME

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace site contents with jukensoudan-route/new"
          git push origin main
