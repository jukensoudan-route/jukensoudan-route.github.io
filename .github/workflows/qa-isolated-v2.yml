name: QA isolated-v2 offline checks

on:
  push:
    branches:
      - test/qa-full-copy-isolated-20261021
    paths:
      - webhook/**
      - TEST/QA/gas/isolated-v2/**
      - TEST/QA/hyogo/index.html
      - .github/workflows/qa-isolated-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-isolated-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out TEST branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install webhook test dependencies
        working-directory: webhook
        run: npm ci

      - name: Test Stripe webhook security and consistency
        working-directory: webhook
        run: npm test

      - name: Check GAS syntax and global declarations
        run: node TEST/QA/gas/isolated-v2/offline-tests/syntax.test.js

      - name: Test Stripe interrupted-grant recovery
        run: node TEST/QA/gas/isolated-v2/offline-tests/stripe-grant-recovery.test.js

      - name: Test question submission idempotency
        run: node TEST/QA/gas/isolated-v2/offline-tests/question-submission-idempotency.test.js

      - name: Test isolated frontend demo
        run: node TEST/QA/gas/isolated-v2/offline-tests/frontend-isolated-demo.test.js

      - name: Verify Questions and Payments column contract
        run: node TEST/QA/gas/isolated-v2/offline-tests/sheets-column-contract.test.js

      - name: Test GAS and Sheets identity boundary
        run: node TEST/QA/gas/isolated-v2/offline-tests/test-environment-boundary.test.js

      - name: Check every isolated GAS module for direct network bypass
        run: node TEST/QA/gas/isolated-v2/offline-tests/all-gas-network-bypass.test.js

      - name: Test B-03A formal prices and hard stops
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-prices-and-hard-stops.test.js

      - name: Test B-03A offline approval and replay decisions
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-offline-replay-decision.test.js

      - name: Test B-03A offline journal replay and expiry
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-offline-journal-planner.test.js

      - name: Ensure offline control is disconnected from GAS entry points
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-offline-isolation.test.js

      - name: Test B-03A outbound request preflight
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-test-request-preflight.test.js

      - name: Test B-03A offline one-shot request control
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-test-request-control.test.js

      - name: Test B-03A fail-closed feature gates
        run: node TEST/QA/gas/isolated-v2/offline-tests/b03a-feature-gates.test.js

      - name: Test external boundary and LINE-safe mock
        run: node TEST/QA/gas/isolated-v2/offline-tests/external-boundary.test.js

      - name: Test LINE delivery safety regression
        run: node TEST/QA/gas/isolated-v2/offline-tests/line-delivery-regression.test.js
