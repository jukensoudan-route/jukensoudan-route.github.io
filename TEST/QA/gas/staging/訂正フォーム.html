<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, "Noto Sans JP", sans-serif;
        margin: 0;
        padding: 20px;
        color: #1f2937;
        background: #f8fafc;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #0b57d0;
      }
      .note {
        margin: 0 0 18px;
        color: #475569;
        font-size: 13px;
        line-height: 1.6;
      }
      .preview-section {
        display: none;
        margin-top: 16px;
      }
      .preview-box {
        max-height: 150px;
        overflow-y: auto;
        white-space: pre-wrap;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        background: #fff;
        font-size: 13px;
        line-height: 1.6;
      }
      .question-box {
        background: #eff6ff;
        border-color: #bfdbfe;
      }
      .loading {
        margin-top: 8px;
        color: #475569;
        font-size: 13px;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: 700;
        font-size: 14px;
      }
      input[type="text"], textarea, select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        background: #fff;
        font-size: 14px;
      }
      textarea {
        min-height: 92px;
        resize: vertical;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #0b57d0;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: .6;
        cursor: wait;
      }
      #result {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        line-height: 1.5;
      }
      #result.success { display: block; background: #dcfce7; color: #166534; }
      #result.error { display: block; background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>回答の部分訂正</h1>
    <p class="note">
      質問IDを入力すると質問文と現在の回答が表示されます。訂正する文を選び、正しい文だけを入力してください。
    </p>

    <form id="correctionForm">
      <label for="questionId">質問ID</label>
      <input id="questionId" name="questionId" type="text" inputmode="numeric" required>
      <div id="loading" class="loading"></div>

      <div id="previewSection" class="preview-section">
        <label>質問文</label>
        <div id="questionPreview" class="preview-box question-box"></div>

        <label>現在の回答</label>
        <div id="answerPreview" class="preview-box"></div>

        <label for="targetText">訂正する文を選択</label>
        <select id="targetText" name="targetText" required></select>
      </div>

      <label for="replacementText">訂正後の文だけを入力</label>
      <textarea id="replacementText" name="replacementText" required></textarea>

      <label for="reason">訂正理由（任意）</label>
      <textarea id="reason" name="reason"></textarea>

      <label for="makeCommonRule">今後の共通ルールにする</label>
      <select id="makeCommonRule" name="makeCommonRule" required>
        <option value="no">いいえ</option>
        <option value="yes">はい</option>
      </select>

      <button id="submitButton" type="submit">安全確認して反映</button>
    </form>

    <div id="result" role="status"></div>

    <script>
      const form = document.getElementById('correctionForm');
      const button = document.getElementById('submitButton');
      const result = document.getElementById('result');
      const loading = document.getElementById('loading');
      const previewSection = document.getElementById('previewSection');
      const questionPreview = document.getElementById('questionPreview');
      const answerPreview = document.getElementById('answerPreview');
      const targetSelect = document.getElementById('targetText');
      let previewTimer = null;
      const gasAvailable =
        window.google &&
        google.script &&
        google.script.run;

      if (!gasAvailable) {
        loading.textContent =
          'この画面は確認用です。Googleスプレッドシートの「ROUTE Q&A」→「部分訂正フォームを開く」から使用してください。';
        button.disabled = true;
      }

      form.questionId.addEventListener('input', function() {
        clearTimeout(previewTimer);
        previewSection.style.display = 'none';
        targetSelect.innerHTML = '';
        const id = form.questionId.value.trim();

        if (!id) {
          loading.textContent = gasAvailable
            ? ''
            : 'この画面は確認用です。Googleスプレッドシートから開いてください。';
          return;
        }

        if (!gasAvailable) {
          loading.textContent =
            'PC上の確認画面からは質問を取得できません。Googleスプレッドシート内の訂正フォームを使用してください。';
          return;
        }

        loading.textContent = '質問と回答を読み込んでいます…';
        previewTimer = setTimeout(function() {
          google.script.run
            .withSuccessHandler(showPreview)
            .withFailureHandler(function(error) {
              loading.textContent = error.message || String(error);
            })
            .getRouteCorrectionPreview(id);
        }, 350);
      });

      function showPreview(response) {
        if (!response.ok) {
          loading.textContent = response.message;
          previewSection.style.display = 'none';
          return;
        }

        loading.textContent = '';
        questionPreview.textContent = response.question;
        answerPreview.textContent = response.answer;
        targetSelect.innerHTML = '';

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = '訂正する文を選んでください';
        targetSelect.appendChild(placeholder);

        response.sentences.forEach(function(sentence) {
          const option = document.createElement('option');
          option.value = sentence;
          option.textContent = sentence;
          targetSelect.appendChild(option);
        });

        previewSection.style.display = 'block';
      }

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        if (!gasAvailable) {
          return;
        }
        button.disabled = true;
        result.className = '';
        result.style.display = 'none';

        const data = {
          questionId: form.questionId.value,
          targetText: form.targetText.value,
          replacementText: form.replacementText.value,
          reason: form.reason.value,
          makeCommonRule: form.makeCommonRule.value
        };

        google.script.run
          .withSuccessHandler(function(response) {
            button.disabled = false;
            result.textContent = response.message;
            result.className = response.ok ? 'success' : 'error';
            result.style.display = 'block';
            if (response.ok) {
              form.replacementText.value = '';
              form.reason.value = '';
              form.makeCommonRule.value = 'no';
              previewSection.style.display = 'none';
              form.questionId.value = '';
            }
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            result.textContent = error.message || String(error);
            result.className = 'error';
            result.style.display = 'block';
          })
          .submitRoutePartialCorrection(data);
      });
    </script>
  </body>
</html>
